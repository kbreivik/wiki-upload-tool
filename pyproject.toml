[project]
name = "wiki-upload-tool"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = ["PySide6>=6.8"]

[project.optional-dependencies]
dev = ["pytest", "pytest-qt", "ruff"]

[project.gui-scripts]
wiki-upload-tool = "src.main:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]
